
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plant Health AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 16px;
      background: #f2f7f0;
      color: #203020;
    }

    h1 { color: #24743b; }

    video, canvas, #preview {
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      margin: 12px auto;
    }

    button, .upload {
      display: inline-block;
      padding: 12px 18px;
      margin: 6px;
      border: none;
      border-radius: 8px;
      background: #24743b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }

    #status { color: #555; }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <h1>🌱 Plant Health AI</h1>
  <p>Take a plant photo to classify it.</p>

  <p id="status">Loading AI model...</p>

  <video id="camera" autoplay playsinline muted hidden></video>
  <canvas id="photo" hidden></canvas>
  <img id="preview" alt="Captured plant photo" hidden>

  <div>
    <button id="startCamera" disabled>Open Camera</button>
    <button id="takePhoto" hidden>Take Picture</button>
    <button id="retake" hidden>Retake</button>
    <button id="classify" hidden>Classify Plant</button>
  </div>

  <div id="result" hidden>
    <h2>Classification Result</h2>
    <p id="plantLabel"></p>
    <p id="confidence"></p>
  </div>

  <script>
    const MODEL_URL =
      "https://teachablemachine.withgoogle.com/models/vASHGJfBi/";

    const camera = document.getElementById("camera");
    const canvas = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");

    const startButton = document.getElementById("startCamera");
    const takeButton = document.getElementById("takePhoto");
    const retakeButton = document.getElementById("retake");
    const classifyButton = document.getElementById("classify");

    const resultBox = document.getElementById("result");
    const plantLabel = document.getElementById("plantLabel");
    const confidence = document.getElementById("confidence");

    let model = null;
    let stream = null;
    let busy = false;
    let imageReady = false;
    let photoObjectUrl = null;

    async function loadModel() {
      try {
        model = await tmImage.load(
          MODEL_URL + "model.json",
          MODEL_URL + "metadata.json"
        );

        status.textContent = "Model ready. Take or select a plant photo.";
        startButton.disabled = false;
      } catch (error) {
        status.textContent =
          "Could not load the model. Check your internet and model URL.";
        console.error(error);
      }
    }

    async function openCamera() {
      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        status.textContent =
          "Camera access is unavailable. Open this page using HTTPS or select a photo.";
        return;
      }

      try {
        stopCamera();

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" }
          }
        });

        camera.srcObject = stream;
        camera.hidden = false;
        preview.hidden = true;
        canvas.hidden = true;

        await camera.play();

        takeButton.hidden = false;
        startButton.hidden = true;
        retakeButton.hidden = true;
        classifyButton.hidden = true;
        imageReady = false;
        resultBox.hidden = true;
        status.textContent = "Point the camera at a plant.";
      } catch (error) {
        status.textContent =
          "Cannot open camera. Allow camera permission or select a photo below.";
        console.error(error);
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      camera.srcObject = null;
      camera.hidden = true;
    }

    function clearResult() {
      resultBox.hidden = true;
      plantLabel.textContent = "";
      confidence.textContent = "";
    }

    function prepareNewPhoto() {
      imageReady = false;
      clearResult();
      status.textContent = "Photo ready. Tap Classify Plant.";
      classifyButton.hidden = false;
      retakeButton.hidden = false;
      takeButton.hidden = true;
    }

    startButton.addEventListener("click", openCamera);

    takeButton.addEventListener("click", function() {
      if (!camera.videoWidth || !camera.videoHeight) {
        status.textContent = "Camera is not ready yet.";
        return;
      }

      canvas.width = camera.videoWidth;
      canvas.height = camera.videoHeight;

      const context = canvas.getContext("2d");
      context.drawImage(camera, 0, 0, canvas.width, canvas.height);
      canvas.dataset.ready = "true";

     stopCamera();

      preview.hidden = true;
      canvas.hidden = false;
      imageReady = true;
      prepareNewPhoto();
    });


    retakeButton.addEventListener("click", openCamera);



classifyButton.addEventListener("click", async () => {
  try {
    if (!model) {
      throw new Error("AI model is not loaded.");
    }

    // Use the picture captured by the camera.
    if (canvas.width === 0 || canvas.height === 0) {
      throw new Error("No captured picture found. Take the picture again.");
    }

    status.textContent = "Analyzing your plant...";
    clearResult();

    const predictions = await model.predict(canvas);

    if (!predictions || predictions.length === 0) {
      throw new Error("No predictions received from the AI.");
    }

    predictions.sort((a, b) => b.probability - a.probability);
    const best = predictions[0];

    plantLabel.textContent = "Plant: " + best.className;
    confidence.textContent =
      "Confidence: " + (best.probability * 100).toFixed(1) + "%";

    resultBox.hidden = false;

  // Send result to MIT App Inventor only when available.

     if (window.AppInventor &&
       typeof window.AppInventor.setWebViewString === "function") {
        window.AppInventor.setWebViewString(
         best.className + " | " + (best.probability * 100) );
       }    
    status.textContent = "Classification complete!";
    console.log("AI predictions:", predictions);

  } catch (error) {
    status.textContent = "Problem: " + error.message;
    console.error(error);
  }
});



    //});

    window.addEventListener("pagehide", stopCamera);

    loadModel();
  </script>
</body>
</html>
